site_name: Bake Linter Documentation
site_description: Documentation for Yocto/OpenEmbedded BitBake Recipe Linter
site_author: Eduardo Correia
docs_dir: .
site_dir: ../_site

# Exclude non-documentation files (only from root docs directory)
exclude_docs: |
  /Dockerfile
  /build-docs.sh
  /mkdocs.yml
  /README.md
  **/*.bb
  **/*.py

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - toc:
      permalink: true
  - tables
  - attr_list
  - md_in_html

