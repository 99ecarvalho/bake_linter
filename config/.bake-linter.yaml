# Bake Linter Configuration
# This file configures the bake-linter tool for this workspace.
# Place in project root as .bake-linter.yaml
#
# Total rules: 99

# Rule configuration
# Each rule can be enabled/disabled and have its severity overridden
rules:
  # ============================================================================
  # BBAPPEND Rules - Rules for .bbappend files
  # ============================================================================
  BBAPPEND001:
    enabled: true
    severity: warning
    # description: Missing FILESEXTRAPATHS

  BBAPPEND002:
    enabled: true
    severity: error
    # description: Task Override Without Suffix

  BBAPPEND003:
    enabled: true
    severity: info
    # description: Version-Specific bbappend

  BBAPPEND004:
    enabled: true
    severity: warning
    # description: Empty bbappend File

  BBAPPEND005:
    enabled: true
    severity: warning
    # description: Global Variable in bbappend

  # ============================================================================
  # BEST PRACTICES Rules
  # ============================================================================
  BESTPRACTICE001:
    enabled: true
    severity: warning
    # description: do_fetch Modification

  BESTPRACTICE002:
    enabled: true
    severity: info
    # description: Cleanup in do_configure

  BESTPRACTICE003:
    enabled: false
    severity: info
    # description: Missing HOMEPAGE

  BESTPRACTICE004:
    enabled: true
    severity: warning
    # description: sed in do_install

  # ============================================================================
  # COMPATIBILITY Rules
  # ============================================================================
  COMPAT001:
    enabled: true
    severity: warning
    # description: Ungrouped COMPATIBLE_HOST Alternation

  COMPAT002:
    enabled: true
    severity: warning
    # description: Unjustified MACHINE_ARCH

  # ============================================================================
  # DEPENDENCY Rules
  # ============================================================================
  DEPENDENCY001:
    enabled: true
    severity: warning
    # description: Wrong Dependency Type

  DEPENDENCY002:
    enabled: true
    severity: warning
    # description: Missing pkgconfig Inherit

  DEPENDENCY003:
    enabled: true
    severity: warning
    # description: Essential Dependency in RRECOMMENDS

  DEPENDS001:
    enabled: true
    severity: warning
    # description: Version Constraint Syntax

  # ============================================================================
  # DEPRECATED Rules
  # ============================================================================
  DEPRECATED001:
    enabled: true
    severity: warning
    # description: Deprecated Override Syntax

  DEPRECATED002:
    enabled: true
    severity: warning
    # description: Deprecated Functions

  DEPRECATED003:
    enabled: true
    severity: warning
    # description: Deprecated Variables

  DEPRECATED004:
    enabled: true
    severity: error
    # description: Python 2 Syntax Detection

  # ============================================================================
  # DOCUMENTATION Rules
  # ============================================================================
  DOC001:
    enabled: true
    severity: warning
    # description: Identical SUMMARY and DESCRIPTION

  DOC002:
    enabled: true
    severity: info
    # description: Missing SUMMARY

  DOC003:
    enabled: true
    severity: info
    # description: Truncated DESCRIPTION

  # ============================================================================
  # FUNCTION Rules
  # ============================================================================
  FUNCTION001:
    enabled: true
    severity: info
    # description: Task Function Order

  FUNCTION002:
    enabled: true
    severity: warning
    # description: Python/Shell Function Mixing

  # ============================================================================
  # INSTALL Rules
  # ============================================================================
  INSTALL001:
    enabled: true
    severity: warning
    # description: Using cp Instead of install

  INSTALL002:
    enabled: true
    severity: warning
    # description: Install Without Explicit Mode

  INSTALL003:
    enabled: true
    severity: info
    # description: mkdir Instead of install -d

  INSTALL004:
    enabled: true
    severity: error
    # description: Installation to /usr/local

  INSTALL005:
    enabled: true
    severity: info
    # description: Non-FHS Installation Path

  # ============================================================================
  # LAYER Rules
  # ============================================================================
  LAYER001:
    enabled: true
    severity: error
    # description: LAYERSERIES_COMPAT Validation

  # ============================================================================
  # LICENSE Rules
  # ============================================================================
  LICENSE001:
    enabled: true
    severity: error
    # description: License Required

  LICENSE002:
    enabled: true
    severity: error
    # description: License Typo Detection

  LICENSE003:
    enabled: true
    severity: warning
    # description: License File Checksum

  # ============================================================================
  # LIFECYCLE Rules
  # ============================================================================
  LIFECYCLE001:
    enabled: true
    severity: info
    # description: Missing Upstream Check Configuration

  # ============================================================================
  # MANDATORY Rules
  # ============================================================================
  MANDATORY001:
    enabled: true
    severity: warning
    # description: Summary/Description Required

  MANDATORY002:
    enabled: true
    severity: info
    # description: SRC_URI Check

  MANDATORY003:
    enabled: true
    severity: info
    # description: Homepage Check

  MANDATORY004:
    enabled: true
    severity: warning
    # description: Inherit Directive Check

  # ============================================================================
  # METADATA Rules
  # ============================================================================
  METADATA001:
    enabled: false
