  STYLE003:
    enabled: true
    severity: warning
    # description: Hardcoded Paths

  STYLE004:
    enabled: false
    severity: info
    # description: TODO/FIXME Detection

  STYLE005:
    enabled: true
    severity: info
    # description: Empty Variable Assignment

  STYLE006:
    enabled: true
    severity: warning
    # description: Duplicate Inherit

  STYLE007:
    enabled: true
    severity: warning
    # description: Package List Format

  STYLE008:
    enabled: true
    severity: warning
    # description: SYSTEMD_AUTO_ENABLE Package Suffix

  STYLE009:
    enabled: true
    severity: info
    # description: Install Directory Trailing Slash

  STYLE010:
    enabled: true
    severity: warning
    # description: Service Files Not in FILES

  # ============================================================================
  # SUPPLY CHAIN Rules
  # ============================================================================
  SUPPLY001:
    enabled: true
    severity: warning
    # description: Missing License Verification in bbappend

  SUPPLY002:
    enabled: true
    severity: warning
    # description: Unreliable Download Hosting

  # ============================================================================
  # SYNTAX Rules
  # ============================================================================
  SYNTAX001:
    enabled: true
    severity: error
    # description: Unmatched Quotes

  SYNTAX002:
    enabled: true
    severity: warning
    # description: Missing Line Continuation

  SYNTAX003:
    enabled: true
    severity: error
    # description: Tabs in Python Functions

  SYNTAX004:
    enabled: true
    severity: error
    # description: Unclosed Variable Expansion

  SYNTAX005:
    enabled: true
    severity: error
    # description: Mixed Override Syntax

  SYNTAX006:
    enabled: true
