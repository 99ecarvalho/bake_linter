# Bake Linter Configuration
# This file configures the bake-linter tool for this workspace.
# Place in project root as .bake-linter.yaml

# Rule configuration
# Each rule can be enabled/disabled and have its severity overridden
rules:
  # License rules
  LICENSE001:
    enabled: true
    severity: error
    # description: Check that LICENSE variable is defined

  LICENSE002:
    enabled: true
    severity: error
    # description: Detect LICENSE typos (LICENSEX, LICENCE, etc.)

  LICENSE003:
    enabled: true
    severity: warning
    # description: Check for LIC_FILES_CHKSUM on non-CLOSED licenses

  # Mandatory variable rules
  MANDATORY001:
    enabled: true
    severity: warning
    # description: Check for SUMMARY or DESCRIPTION

  MANDATORY002:
    enabled: true
    severity: info
    # description: Check for SRC_URI (where applicable)

  MANDATORY003:
    enabled: true
    severity: info
    # description: Check for HOMEPAGE on open-source recipes

  MANDATORY004:
    enabled: true
    severity: warning
    # description: Check for proper inherit directives

  # Deprecated syntax rules
  DEPRECATED001:
    enabled: true
    severity: warning
    # description: Detect old underscore override syntax

  DEPRECATED002:
    enabled: true
    severity: warning
    # description: Detect deprecated BitBake functions

  DEPRECATED003:
    enabled: true
    severity: warning
    # description: Detect deprecated variables

  DEPRECATED004:
    enabled: true
    severity: error
    # description: Detect Python 2 syntax

  # Naming convention rules
  NAMING001:
    enabled: true
    severity: warning
    # description: Check variable naming conventions

  NAMING002:
    enabled: true
    severity: info
    # description: Check recipe file naming conventions

  NAMING003:
    enabled: true
    severity: warning
    # description: Check PN consistency with filename

  # Style rules (some disabled by default - can be noisy)
  STYLE001:
    enabled: false
    severity: info
    # description: Check for trailing whitespace

  STYLE002:
    enabled: false
    severity: info
    options:
      max_length: 120
    # description: Check for long lines

  STYLE003:
    enabled: true
    severity: warning
    # description: Detect hardcoded paths

  STYLE004:
    enabled: false
    severity: info
    # description: Flag TODO/FIXME comments

  STYLE005:
    enabled: true
    severity: info
    # description: Flag empty variable assignments

  STYLE006:
    enabled: true
    severity: warning
    # description: Detect duplicate inherit statements

  # Security rules
  SECURITY001:
    enabled: true
    severity: warning
    # description: Check for insecure HTTP URIs

  SECURITY002:
    enabled: true
    severity: warning
    # description: Check for missing checksums

  SECURITY003:
    enabled: true
    severity: warning
    # description: Check for overly permissive file permissions

  SECURITY004:
    enabled: true
    severity: error
    # description: Detect potential hardcoded credentials

# General settings
settings:
  # Skip files that appear to be autogenerated
  skip_autogenerated: true

  # Maximum line length for STYLE002 rule
  max_line_length: 120

  # Enable colored output (set to false for CI)
  color: true

# File patterns to exclude from linting
exclude:
  - "build/*"
  - "tmp/*"
  - "sstate-cache/*"
  - "downloads/*"
  - "*.bak"
  - "*~"

# You can also enable/disable entire groups
# enable_groups:
#   - license
#   - security
#
# disable_groups:
#   - style
