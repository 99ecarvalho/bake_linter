  # ============================================================================
  # VARIABLES Rules
  # ============================================================================
  VARIABLES001:
    enabled: true
    severity: warning
    # description: Git Recipe PV Without +git

  VARIABLES002:
    enabled: true
    severity: warning
    # description: Unconventional S Assignment

  VARIABLES003:
    enabled: true
    severity: info
    # description: Unused Variable Assignment

  VARIABLES004:
    enabled: true
