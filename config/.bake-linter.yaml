# ============================================================================
# General settings
# ============================================================================
settings:
  # Skip files that appear to be autogenerated
  skip_autogenerated: true

  # Maximum line length for STYLE002 rule
  max_line_length: 120

  # Yocto release to validate against, passed through to oelint-adv's
  # --release so its release-gated rules (e.g. oelint.vars.unpackdir, which
  # needs styhead or later) match the release you build. Unset, oelint-adv
  # uses its newest supported release.
  # oelint_release: scarthgap

  # Custom machine names your BSP layer defines. oelint-adv's built-in
  # MachinesKnown list does not know them, so its oelint.vars.specific rule
  # flags every override on them (e.g. IMAGE_INSTALL:append:my-board) as
  # unknown. Passed through to oelint-adv's --constantmods.
  oelint_extra_machines: []
  #   - my-board

  # Enable colored output (set to false for CI)
  color: true

# ============================================================================
# File patterns to exclude from linting
# ============================================================================
exclude:
  - "build/*"
  - "tmp/*"
  - "sstate-cache/*"
  - "downloads/*"
  - "*.bak"
  - "*~"

# ============================================================================
# Group configuration (optional)
# ============================================================================
# You can also enable/disable entire groups
# enable_groups:
#   - license
#   - security
#
# disable_groups:
#   - style
