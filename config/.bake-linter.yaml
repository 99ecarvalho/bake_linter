  # ============================================================================
  # SYSTEMD Rules
  # ============================================================================
  SYSTEMD001:
    enabled: true
    severity: error
    # description: Systemd Usage Without Inherit

  SYSTEMD002:
    enabled: true
    severity: error
    # description: Missing SYSTEMD_SERVICE Declaration

  SYSTEMD003:
    enabled: true
