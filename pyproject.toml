[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bake-linter"
version = "1.0.0"
description = "Static analysis for BitBake recipes"
readme = "README.md"
license = {text = "LGPL-3.0-or-later"}
requires-python = ">=3.9"
authors = [
    {name = "Eduardo Correia", email = "ecorreia@apliant.com.br"}
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Lesser General Public License v3 or later (LGPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
keywords = ["yocto", "openembedded", "linter", "bitbake", "embedded-linux"]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
bake-linter = "bake_linter.cli:main"

[project.urls]
Homepage = "https://github.com/99ecarvalho/bake_linter"
Documentation = "https://github.com/99ecarvalho/bake_linter#readme"
Repository = "https://github.com/99ecarvalho/bake_linter.git"

[tool.setuptools.packages.find]
where = ["."]
include = ["bake_linter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["bake_linter"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
